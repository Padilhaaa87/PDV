<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDV Web - Sincronizado na Nuvem</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .aba-conteudo { display: none; }
    .aba-conteudo.ativa { display: block; }
    .oculto-autenticacao { display: none !important; }

    /* MODO ESCURO */
    body.dark { background-color: #0f172a !important; color: #f8fafc !important; }
    body.dark #telaAutenticacao { background-color: #0f172a !important; }
    body.dark .bg-white { background-color: #1e293b !important; color: #f8fafc !important; }
    body.dark .bg-gray-50, body.dark .bg-gray-100, body.dark .bg-blue-50 { background-color: #334155 !important; color: #f8fafc !important; }
    body.dark .text-gray-700, body.dark .text-gray-800, body.dark .text-gray-500 { color: #cbd5e1 !important; }
    body.dark .border, body.dark .border-b { border-color: #475569 !important; }
    body.dark input, body.dark select { background-color: #0f172a !important; color: #ffffff !important; border-color: #475569 !important; }
  </style>
</head>
<body id="bodyApp" class="bg-gray-100 font-sans text-gray-800 transition-colors duration-300">

  <!-- TELA DE AUTENTICAÇÃO -->
  <div id="telaAutenticacao" class="min-h-screen flex items-center justify-center bg-blue-50 p-4">
    <div class="bg-white p-6 md:p-8 rounded-xl shadow-xl border border-blue-100 w-full max-w-lg space-y-6 relative">
      
      <div class="flex justify-between items-center border-b pb-3">
        <h1 class="text-2xl font-bold text-blue-600">PDV Nuvem</h1>
        <button onclick="alternarModoEscuro()" class="bg-gray-100 text-xs px-3 py-1.5 rounded-full font-semibold border">🌙 Modo Escuro</button>
      </div>

      <!-- FORMULÁRIO DE LOGIN -->
      <form id="formLogin" onsubmit="fazerLogin(event)" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700">Utilizador</label>
          <input type="text" id="loginUsuario" required placeholder="Digite seu utilizador" class="w-full p-3 border rounded outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Palavra-passe (Senha)</label>
          <input type="password" id="loginSenha" required placeholder="••••••••" class="w-full p-3 border rounded outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div class="flex justify-between items-center text-xs">
          <button type="button" onclick="alternarModalRecuperacao(true)" class="text-blue-600 hover:underline font-semibold">
            Esqueci minha palavra-passe
          </button>
        </div>

        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded transition shadow">
          Acessar Sistema
        </button>
      </form>
    </div>
  </div>

  <!-- MODAL DE RECUPERAÇÃO VIA WHATSAPP E E-MAIL -->
  <div id="modalRecuperacaoSenha" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-xl p-6 w-full max-w-md space-y-4 shadow-2xl">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="text-lg font-bold text-gray-800">🔒 Recuperação de Acesso</h3>
        <button onclick="alternarModalRecuperacao(false)" class="text-gray-400 font-bold text-xl">✕</button>
      </div>
      <form onsubmit="processarRecuperacaoSenha(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">Telefone/WhatsApp ou E-mail</label>
          <input type="text" id="campoRecuperacao" required placeholder="(42) 98869-1426 ou email@exemplo.com" class="w-full p-2.5 border rounded text-sm">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">Canal de Envio</label>
          <select id="canalEnvioCodigo" class="w-full p-2.5 border rounded text-sm">
            <option value="whatsapp">📱 Enviar via WhatsApp</option>
            <option value="email">📧 Enviar via E-mail</option>
          </select>
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="alternarModalRecuperacao(false)" class="px-4 py-2 bg-gray-200 text-xs rounded">Cancelar</button>
          <button type="submit" class="px-4 py-2 bg-blue-600 text-white font-bold text-xs rounded shadow">Enviar Código</button>
        </div>
      </form>
    </div>
  </div>

  <!-- APLICAÇÃO PRINCIPAL DA LOJA -->
  <div id="appPrincipal" class="oculto-autenticacao min-h-screen flex flex-col">
    <header class="bg-blue-700 text-white p-4 shadow-md sticky top-0 z-50 flex justify-between items-center">
      <h1 class="text-xl md:text-2xl font-bold">PDV Web - Sincronizado</h1>
      <button onclick="fazerLogout()" class="bg-red-500 hover:bg-red-600 text-white text-xs px-3 py-1.5 rounded font-semibold">Sair</button>
    </header>

    <main class="max-w-7xl mx-auto p-4 md:p-6 flex-grow w-full space-y-6">
      <!-- FORMULÁRIO DE PRODUTO -->
      <div class="bg-white p-6 rounded-lg shadow-md space-y-4">
        <h2 class="text-xl font-bold text-gray-700">Cadastrar Produto na Nuvem</h2>
        <form onsubmit="salvarProdutoNuvem(event)" class="grid grid-cols-1 sm:grid-cols-4 gap-4">
          <input type="text" id="prodNome" placeholder="Nome do Produto" required class="p-2 border rounded">
          <input type="number" id="prodCusto" step="0.01" placeholder="Custo (R$)" required class="p-2 border rounded">
          <input type="number" id="prodVenda" step="0.01" placeholder="Venda (R$)" required class="p-2 border rounded">
          <input type="number" id="prodEstoque" placeholder="Estoque Qtd" required class="p-2 border rounded">
          <button type="submit" class="sm:col-span-4 bg-green-600 hover:bg-green-700 text-white font-bold py-2 rounded shadow">
            ☁️ Salvar e Sincronizar Produto
          </button>
        </form>
      </div>

      <!-- LISTA DE PRODUTOS SINCRONIZADA -->
      <div class="bg-white p-6 rounded-lg shadow-md">
        <h2 class="text-xl font-bold mb-4 text-gray-700">Estoque em Tempo Real (Computador e Telemóvel)</h2>
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse text-sm">
            <thead>
              <tr class="bg-gray-100 border-b">
                <th class="p-2">Nome</th>
                <th class="p-2">Custo</th>
                <th class="p-2">Venda</th>
                <th class="p-2">Estoque</th>
              </tr>
            </thead>
            <tbody id="tabelaProdutos"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- CONEXÃO COM O FIREBASE CLOUD (SDK V10) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 🔴 COLE AQUI AS SUAS CHAVES DO FIREBASE
    const firebaseConfig = {
      apiKey: "COLE_SUA_API_KEY_AQUI",
      authDomain: "SEU_PROJECT_ID.firebaseapp.com",
      projectId: "SEU_PROJECT_ID",
      storageBucket: "SEU_PROJECT_ID.appspot.com",
      messagingSenderId: "123456789",
      appId: "SEU_APP_ID"
    };

    // Inicializar Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.db = db;
    window.produtos = [];

    // ESCUTAR MUDANÇAS EM TEMPO REAL NA NUVEM
    window.carregarProdutosNuvem = function() {
      onSnapshot(collection(db, "produtos"), (snapshot) => {
        window.produtos = [];
        snapshot.forEach((docSnap) => {
          window.produtos.push({ idDoc: docSnap.id, ...docSnap.data() });
        });
        renderizarTabela();
      });
    };

    // SALVAR PRODUTO NA NUVEM
    window.salvarProdutoNuvem = async function(e) {
      e.preventDefault();
      const nome = document.getElementById('prodNome').value.trim();
      const custo = parseFloat(document.getElementById('prodCusto').value);
      const venda = parseFloat(document.getElementById('prodVenda').value);
      const estoque = parseInt(document.getElementById('prodEstoque').value) || 0;

      await addDoc(collection(db, "produtos"), {
        nome, custo, venda, estoque, dataCriacao: new Date().toISOString()
      });

      e.target.reset();
      alert('✅ Produto salvo e sincronizado na nuvem com sucesso!');
    };

    window.renderizarTabela = function() {
      const tbody = document.getElementById('tabelaProdutos');
      tbody.innerHTML = '';
      window.produtos.forEach(prod => {
        tbody.innerHTML += `
          <tr class="border-b">
            <td class="p-2 font-medium">${prod.nome}</td>
            <td class="p-2">R$ ${prod.custo.toFixed(2)}</td>
            <td class="p-2">R$ ${prod.venda.toFixed(2)}</td>
            <td class="p-2 font-bold">${prod.estoque} un.</td>
          </tr>`;
      });
    };

    window.fazerLogin = function(e) {
      e.preventDefault();
      document.getElementById('telaAutenticacao').classList.add('hidden');
      document.getElementById('appPrincipal').classList.remove('oculto-autenticacao');
      window.carregarProdutosNuvem();
    };

    window.fazerLogout = function() {
      document.getElementById('appPrincipal').classList.add('oculto-autenticacao');
      document.getElementById('telaAutenticacao').classList.remove('hidden');
    };

    window.alternarModalRecuperacao = function(exibir) {
      document.getElementById('modalRecuperacaoSenha').classList.toggle('hidden', !exibir);
    };

    window.processarRecuperacaoSenha = function(e) {
      e.preventDefault();
      const contato = document.getElementById('campoRecuperacao').value.trim();
      const canal = document.getElementById('canalEnvioCodigo').value;
      const token = Math.floor(100000 + Math.random() * 900000).toString();

      if (canal === 'whatsapp') {
        const num = contato.replace(/\D/g, '');
        window.open(`https://wa.me/55${num}?text=Seu%20c%C3%B3digo%20PDV:%20${token}`, '_blank');
      } else {
        window.location.href = `mailto:${contato}?subject=Código%20PDV&body=Seu%20c%C3%B3digo:%20${token}`;
      }
      alert(`Código enviado: ${token}`);
      window.alternarModalRecuperacao(false);
    };

    window.alternarModoEscuro = function() {
      document.getElementById('bodyApp').classList.toggle('dark');
    };
  </script>
</body>
</html>
